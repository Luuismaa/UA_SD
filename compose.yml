services:
  kafka:
    image: apache/kafka:3.9.1          # imagen oficial de Apache, modo KRaft (sin Zookeeper)
    container_name: wm-kafka           # nombre fijo: así los comandos docker exec son siempre iguales
    ports:
      - "9092:9092"                    # puerto del PC : puerto del contenedor
    environment:
      # --- KRaft: este único nodo hace de broker Y de controlador del clúster ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners: dónde escucha (LISTENERS) y qué dirección anuncia a los clientes (ADVERTISED) ---
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # --- Un solo broker: no se puede replicar nada, así que todo a 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # que los consumidores empiecen sin esperar

      # --- Los topics los crea SOLO la Central ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"