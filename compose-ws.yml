services:
  monitor:
    image: luuiss/wm-ws:latest
    # El orden ahora es: <puerto Engine> <IP:puerto Central> <ID> <ubicación>
    command: ["java", "-jar", "monitor.jar", "6000", "${CENTRAL_IP:-184.194.154.93}:5050", "${ID_WS:-WS-01}", "${UBICACION:-ZONA_A}"]

  engine:
    image: luuiss/wm-ws:latest
    depends_on:
      - monitor
    stdin_open: true 
    tty: true        
    command: ["java", "-jar", "engine.jar", "${KAFKA_IP:-18.211.92.44}:9092", "monitor:6000"]